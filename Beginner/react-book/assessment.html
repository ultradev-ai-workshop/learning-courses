<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'&gt;&lt;text y='.9em' font-size='90'&gt;✅&lt;/text&gt;&lt;/svg&gt;">
<title>Final Assessment · React Beginner Book</title>
<link rel="stylesheet" href="book.css">
<link rel="stylesheet" href="../../shared/site.css">
<script src="../../shared/site.js"></script>
<style>
  .chip { display: inline-block; font-size: 0.78rem; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); margin-right: 6px; }
  .chip.topic { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
  .progress { height: 6px; background: var(--surface-2); border-radius: 999px; overflow: hidden; margin: 10px 0 18px; }
  .progress > div { height: 100%; background: var(--accent); transition: width .2s; }
  .q-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; color: var(--muted); font-size: 0.92rem; }
  .q-text { font-size: 1.2rem; color: var(--heading); font-weight: 600; margin: 8px 0 4px; }
  .hint { color: var(--muted); font-size: 0.88rem; margin: 0 0 12px; }
  pre.q-code { background: var(--code-bg); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; overflow-x: auto; line-height: 1.5; margin: 12px 0; }
  pre.q-code code { background: none; border: 0; padding: 0; font-size: 0.86rem; color: var(--code-text); }
  .opts { display: grid; gap: 10px; margin: 14px 0; }
  .opt { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; cursor: pointer; background: var(--bg); }
  .opt:hover { border-color: var(--accent); }
  .opt.selected { border-color: var(--accent); background: var(--accent-soft); }
  .opt input { margin-top: 4px; width: 18px; height: 18px; accent-color: var(--accent); flex-shrink: 0; }
  .opt .key { font: 0.75rem ui-monospace, Menlo, monospace; color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; margin-left: auto; align-self: center; }
  .opt-text { white-space: pre-wrap; word-break: break-word; }
  .nav { display: flex; gap: 10px; justify-content: space-between; flex-wrap: wrap; margin-top: 18px; }
  .btn { font: inherit; padding: 9px 18px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--heading); cursor: pointer; }
  .btn:hover:not(:disabled) { border-color: var(--accent); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 600; }
  .palette { display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 6px; margin-top: 24px; }
  .palette button { font: 0.85rem inherit; padding: 6px 0; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); cursor: pointer; }
  .palette button.answered { background: var(--accent-soft); color: var(--accent); border-color: transparent; font-weight: 600; }
  .palette button.current { outline: 2px solid var(--accent); outline-offset: 1px; }
  .score-card { text-align: center; padding: 24px; border-radius: 16px; background: var(--surface); border: 1px solid var(--border); margin: 16px 0 24px; }
  .score-big { font-size: 3rem; font-weight: 800; color: var(--heading); line-height: 1.1; }
  .bar { height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; min-width: 80px; }
  .bar > div { height: 100%; background: var(--accent); }
  .review { border: 1px solid var(--border); border-radius: 12px; padding: 4px 18px 14px; margin: 14px 0; }
  .review.right { border-left: 5px solid var(--tip-border); }
  .review.wrong { border-left: 5px solid var(--bad-border); }
  .r-opt { padding: 6px 10px; border-radius: 6px; margin: 4px 0; white-space: pre-wrap; }
  .r-opt.correct { background: var(--tip-bg); }
  .r-opt.picked-wrong { background: var(--bad-bg); }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; }
  .filters .btn.active { border-color: var(--accent); color: var(--accent); }
  .muted { color: var(--muted); }
  .hidden { display: none !important; }
  .timer-bar { position: sticky; top: 0; z-index: 5; display: flex; justify-content: flex-end; margin: 0 0 6px; pointer-events: none; }
  .timer { pointer-events: auto; font: 700 1.05rem ui-monospace, Menlo, monospace; font-variant-numeric: tabular-nums; padding: 5px 14px; border-radius: 99px;
    border: 1.5px solid var(--border); background: var(--surface); color: var(--heading); box-shadow: 0 2px 8px rgba(0,0,0,.12); }
  .timer.warn { border-color: #d29922; color: #d29922; }
  .timer.danger { border-color: var(--bad-border); color: var(--bad-border); animation: timer-pulse 1s ease-in-out infinite; }
  @keyframes timer-pulse { 50% { opacity: .55; } }
  @media (prefers-reduced-motion: reduce) { .timer.danger { animation: none; } }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .callout.warn { border: 1px solid #d29922; background: rgba(210,153,34,.12); border-radius: 10px; padding: 10px 14px; }
</style>
</head>
<body>
<div class="layout">
<aside id="sidebar"></aside>
<main>
  <p class="eyebrow">Final Assessment</p>
  <h1>Test Your React Knowledge</h1>
  <div class="timer-bar hidden" id="timer-bar"><span class="timer" id="timer" role="timer">⏱ 50:00</span></div>
  <div class="sr-only" id="timer-live" aria-live="assertive"></div>
  <div id="app"><p class="muted">Loading questions…</p></div>
  <nav id="pager"></nav>
</main>
</div>
<script src="book.js"></script>
<script src="assessment.js"></script>
</body>
</html>
