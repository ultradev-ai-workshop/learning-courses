[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tracker"
version = "0.1.0"
description = "A tiny command-line expense tracker"
requires-python = ">=3.15"

[project.scripts]
expenses = "tracker.__main__:main"

[tool.setuptools]
packages = ["tracker"]
